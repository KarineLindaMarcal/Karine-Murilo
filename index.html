<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casamento – Karine & Murilo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
    <div class="overlay"></div>
    <h1>Karine & Murilo</h1>
    <p>Estamos felizes em convidar você para o nosso grande dia.</p>
</header>

<section class="convite">
    <h2>Convite</h2>
    <p class="texto">
        Com imensa alegria convidamos você para celebrar conosco um momento tão especial!
    </p>

    <div class="card-convite">
        <div class="topo">K & M</div>
        <div class="conteudo">
            <p>Karine e Murilo</p>
            <span>26 de Novembro de 2026 • 17h30</span>
            <span>Igreja Matriz – Centro</span>
        </div>
    </div>
</section>

<section class="rsvp">
    <h2>Confirme sua Presença</h2>
    <form>
        <input type="text" placeholder="Seu nome" required>
        <input type="number" placeholder="Quantidade de convidados" min="1" required>
        <button type="submit">Confirmar</button>
    </form>
</section>

<footer>
    Esperamos você!
</footer>

</body>
</html>
