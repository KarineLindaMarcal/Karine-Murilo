<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casamento • Convite</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header>
        <h1>Karine & Murilo</h1>
        <p>É com enorme alegria que convidamos você para celebrar nosso grande dia.</p>
    </header>

    <!-- ===== CONTAGEM ===== -->
    <div class="countdown-box">
        <h3 class="countdown-title">Contagem Regressiva</h3>
        <div id="countdown">Carregando...</div>
    </div>

    <!-- ===== DETALHES ===== -->
    <section class="section">
        <h2>Detalhes do Casamento</h2>
        <p style="font-size: 19px;">
            Data: <strong>22 de Novembro de 2026</strong><br>
            Horário: <strong>08h30</strong>
        </p>
    </section>

    <!-- ===== LOCAL ===== -->
    <section class="section">
        <h2>Local</h2>
        <p style="font-size: 19px;">
            Rua Tuim 33, Arapongas, PR, 86709-380
        </p>
    </section>

    <!-- ===== RSVP ===== -->
    <section class="section">
        <h2>Confirme Sua Presença</h2>

        <form id="rsvpForm">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" required>

            <label for="presenca">Você irá ao casamento?</label>
            <select id="presenca">
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>

            <label for="acompanhantes">Acompanhantes</label>
            <input type="number" id="acompanhantes" min="0" value="0">

            <button type="submit">Enviar Confirmação</button>
        </form>

        <p id="mensagem" style="margin-top: 25px; font-size: 20px; font-weight: 600;"></p>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>Esperamos por você!</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
